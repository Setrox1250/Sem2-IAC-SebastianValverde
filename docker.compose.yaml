services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE1}
  api2:
    build: .
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE2}
  api3:
    build: .
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE3}

  bd:
    image: 'postgres'
    environment:
      - 'POSTGRES_PASSWORD=${BD_PASSWD}'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
